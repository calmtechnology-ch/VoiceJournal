; PlatformIO Project Configuration File
; VoiceJournal v0.3.0 — Structured Memory pour M5Stack CoreS3
; Base sur VoiceKit (https://github.com/calmtechnology-ch/VoiceKit) et LVGL 9

[env:m5stack-cores3]
platform = espressif32@6.9.0
board = m5stack-cores3
framework = arduino
lib_ldf_mode = deep
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = dio
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = partitions_16MB.csv
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_RUNNING_CORE=1
    -DARDUINO_EVENT_RUNNING_CORE=1
    -DBOARD_M5STACK_CORES3=1
    -DVOXCORE_AUDIO_MODE=2
    -DVOICEKIT_DEFAULT_MODEL=\"models/gemini-3.8-live\"
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -Iinclude
lib_deps =
    m5stack/M5CoreS3@1.0.0
    m5stack/M5Unified@0.2.23
    lvgl/lvgl@9.6.0
    ; Revision Git verifiee et reproductible de VoiceKit (v0.6.7.2)
    https://github.com/calmtechnology-ch/VoiceKit.git#16646c73acf01a8d57408391bc6de15a288b8910
